<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carbonstore</title>
<style>
  body {
    background: #ffffff;
    color: #000000;
    font-family: monospace;
    font-size: 14px;
    margin: 0;
    padding: 10px;
  }
  h1 {
    font-size: 20px;
    border-bottom: 2px solid #000;
    padding-bottom: 4px;
    margin-bottom: 4px;
  }
  p.sub {
    margin: 0 0 14px 0;
    color: #555;
    font-size: 12px;
  }
  input[type="text"] {
    width: 200px;
    padding: 3px 5px;
    border: 1px solid #000;
    font-family: monospace;
    font-size: 13px;
    margin-bottom: 10px;
  }
  select {
    padding: 3px 5px;
    border: 1px solid #000;
    font-family: monospace;
    font-size: 13px;
    margin-bottom: 10px;
    margin-left: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    background: #000;
    color: #fff;
    text-align: left;
    padding: 4px 8px;
    font-weight: normal;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid #ccc;
    vertical-align: middle;
  }
  tr:hover td {
    background: #f0f0f0;
  }
  .thumb {
    width: 92px;
    height: 43px;
    object-fit: cover;
    display: block;
    border: 1px solid #ccc;
    background: #eee;
  }
  .thumb-cell {
    width: 100px;
    padding: 4px 6px;
  }
  .tag {
    display: inline-block;
    background: #e0e0e0;
    font-size: 11px;
    padding: 1px 5px;
    margin-right: 3px;
  }
  a.dl {
    color: #fff;
    background: #000;
    padding: 3px 10px;
    text-decoration: none;
    font-size: 12px;
    display: inline-block;
    white-space: nowrap;
  }
  a.dl:hover {
    background: #444;
  }
  .win-badge {
    font-size: 11px;
    color: #0078d7;
    font-weight: bold;
  }
  .size { color: #555; font-size: 12px; }
  .rating { color: #888; font-size: 12px; white-space: nowrap; }
  #count { font-size: 12px; color: #555; margin-bottom: 6px; }
  footer {
    margin-top: 20px;
    border-top: 1px solid #ccc;
    padding-top: 6px;
    font-size: 11px;
    color: #888;
  }
</style>
</head>
<body>

<h1>carbonstore</h1>
<p class="sub">a simple game store for <span class="win-badge">Windows</span>. click download to get a game.</p>

<input type="text" id="search" placeholder="search games..." oninput="render()">
<select id="genre" onchange="render()">
  <option value="">all genres</option>
  <option value="action">action</option>
  <option value="rpg">rpg</option>
  <option value="strategy">strategy</option>
  <option value="puzzle">puzzle</option>
  <option value="shooter">shooter</option>
  <option value="survival">survival</option>
  <option value="platformer">platformer</option>
  <option value="horror">horror</option>
  <option value="simulation">simulation</option>
</select>

<div id="count"></div>

<table id="table">
  <thead>
    <tr>
      <th></th>
      <th>name</th>
      <th>genre</th>
      <th>size</th>
      <th>rating</th>
      <th>os</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<footer>basic game store. windows only.</footer>

<script>
// Add your games here. Copy the template below and fill in your own info.
// img: use a direct image URL, or set steamId to your game's Steam app ID for an auto thumbnail.
// Leave steamId as null if you have a custom img URL.

var games = [
  {
    name: "Deltarune",
    genre: "rpg",
    size: "504 MB",
    rating: "4,8/5",
    tags: ["bullet hell", "story-rich"],
    url: "https://buffdrive.com/7cn?pt=ZWVncDNOeDVVNjN1T3FoRzE4MTVlWGQyWWtsVVZFWmxOSHBxYm1GS1YxRlNXSE51UzBFOVBRPT0%3D",
    img: "",
    steamId: "1671210"
  },
  {
    name: "Undertale",
    genre: "rpg",
    size: "172 MB",
    rating: "4,9/10",
    tags: ["pixel art", "choices matter"],
    url: "https://buffdrive.com/rv?pt=OCtKMlJkNXVsTGlJWDBLUjN3Wk0yVWxITlVJclRFaHVURVUyWm1WaVVIZExaa1UwUjJjOVBRPT0%3D",
    img: "",
    steamId: "391540"
  },
  {
    name: "Ultrakill",
    genre: "action",
    size: "3.3 GB",
    rating: "4,9/10",
    tags: ["pixel art", "choices matter"],
    url: "https://buffdrive.com/cqa?pt=a210Nm5IVVpmL0tONXpld2oxTGtIRFZWZHl0b1NVRXdSSHBaT0UxT1NrOWhTbXhvTWtFOVBRPT0%3D",
    img: "",
    steamId: "1229490"
  },
  {
    name: "Geometry Dash",
    genre: "action",
    size: "204 MB",
    rating: "4,7/10",
    tags: ["rhythm game", "level editor"],
    url: "https://buffdrive.com/4wo?pt=cm5XR1JFVXp6UU9IQmxFVjVyR2IwMVJvYW5sTU9VTkJSamx6Ym5CS1JtSkxiVlJyYmxFOVBRPT0%3D",
    img: "",
    steamId: "322170"
  },
  {
    name: "People Playground",
    genre: "simulation",
    size: "211 MB",
    rating: "4,8/10",
    tags: ["physics", "gore"],
    url: "https://buffdrive.com/cpx?pt=OU5pdXJRaTJUaDlEOWl0VExBTUxWamd5Y2pJck9VdENVRWhaY0RNMGVrMHlZWEpHZDFFOVBRPT0%3D",
    img: "",
    steamId: "1118200"
  },
  {
    name: "Lethal Company",
    genre: "horror",
    size: "706 MB",
    rating: "4,8/10",
    tags: ["co-op", "extraction"],
    url: "https://buffdrive.com/cos?pt=cWFEVGVqUndMVFZBQzRaYUk3MnYvRkZyYjBoMFNqSklNaXRSTHpGdVNEUnhSSHBSSzJjOVBRPT0%3D",
    img: "",
    steamId: "1966720"
  },
  {
    name: "Omori",
    genre: "horror",
    size: "1.81 GB",
    rating: "4,8/10",
    tags: ["psychological horror", "story-rich"],
    url: "https://buffdrive.com/ry?pt=dmJlMXRrZkdHT1dXZ0VwTGpWazRhRXB2Y2pac1VGbE1abUpKTHpoWVdIQlRRMjF6Wm1jOVBRPT0%3D",
    img: "",
    steamId: "1150690"
  },
  {
    name: "Among Us",
    genre: "multiplayer",
    size: "677 MB",
    rating: "4,5/10",
    tags: ["strategy", "party game"],
    url: "https://buffdrive.com/9P7?pt=RVBmV0FQVXovR0s5ckpid2ZpcnlUVkpyVUZadmJHcHZlWEo2WTI1aWNXMHpWa2hRT0VFOVBRPT0%3D",
    img: "",
    steamId: "945360"
  },
  
  
];

function getImg(gm) {
  if (gm.img) return gm.img;
  if (gm.steamId) return "https://cdn.akamai.steamstatic.com/steam/apps/" + gm.steamId + "/capsule_231x87.jpg";
  return "";
}

function render() {
  var q = document.getElementById('search').value.toLowerCase();
  var g = document.getElementById('genre').value;
  var filtered = games.filter(function(gm) {
    var matchQ = !q || gm.name.toLowerCase().indexOf(q) !== -1 || gm.tags.join(' ').indexOf(q) !== -1;
    var matchG = !g || gm.genre === g;
    return matchQ && matchG;
  });
  document.getElementById('count').textContent = filtered.length + ' game(s) found';
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var gm = filtered[i];
    var taghtml = '';
    for (var t = 0; t < gm.tags.length; t++) {
      taghtml += '<span class="tag">' + gm.tags[t] + '</span>';
    }
    var imgSrc = getImg(gm);
    html += '<tr>';
    html += '<td class="thumb-cell"><img class="thumb" src="' + imgSrc + '" alt="' + gm.name + '" onerror="this.style.display=\'none\'"></td>';
    html += '<td><b>' + gm.name + '</b><br>' + taghtml + '</td>';
    html += '<td>' + gm.genre + '</td>';
    html += '<td class="size">' + gm.size + '</td>';
    html += '<td class="rating">&#9733; ' + gm.rating + '</td>';
    html += '<td><span class="win-badge">&#x229E; Win</span></td>';
    html += '<td><a class="dl" href="' + gm.url + '" target="_blank" rel="noopener">download</a></td>';
    html += '</tr>';
  }
  document.getElementById('tbody').innerHTML = html || '<tr><td colspan="7">no games found.</td></tr>';
}

render();
</script>
</body>
</html>
